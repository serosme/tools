blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.101'
  - '@ai-sdk/openai-compatible@3.0.60'
  - '@ai-sdk/provider-utils@5.0.52'
  - '@ai-sdk/provider@4.0.20'
  - '@ai-sdk/vue@4.0.123'
  - ai@7.0.123

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - semver@5.7.2
  - undici-types@6.21.0

nodeLinker: hoisted
shellEmulator: true

allowBuilds:
  esbuild: true
  uiohook-napi: true
  vue-demi: true
