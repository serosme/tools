blockExoticSubdeps: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.106'
  - '@ai-sdk/openai-compatible@3.0.65'
  - '@ai-sdk/provider-utils@5.0.56'
  - '@ai-sdk/provider@4.0.24'
  - '@ai-sdk/vue@4.0.130'
  - ai@7.0.130
  - electron@44.6.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - semver@5.7.2
  - undici-types@6.21.0

nodeLinker: hoisted
shellEmulator: true

allowBuilds:
  esbuild: true
  uiohook-napi: true
  vue-demi: true
